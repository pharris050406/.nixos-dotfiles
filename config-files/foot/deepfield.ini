# ~/.config/foot/deepfield.ini — Deep Field colors for foot (>= 1.26).
# In foot.ini, put this as the FIRST line of [main]:
#     include=~/.config/foot/deepfield.ini
# and delete any [colors] / [colors-dark] block of your own (or keep one
# below the include to override single values, e.g. alpha).

[main]
shell=fish
pad=14x10

[colors-dark]
alpha=0.6
background=181825
foreground=cdd6f4

# normal / bright
regular0=45475a
regular1=e78284
regular2=a6d189
regular3=e5c890
regular4=8caaee
regular5=ca9ee6
regular6=81c8be
regular7=bac2de

bright0=585b70
bright1=eb9596
bright2=b3d89b
bright3=e9d0a1
bright4=9db7f1
bright5=d2adea
bright6=94d0c8
bright7=e6e9f7

# text, then cursor: the same blue as the focused window border and the bar's ship
cursor=181825 8caaee
selection-foreground=cdd6f4
selection-background=38415d
urls=81c8be
