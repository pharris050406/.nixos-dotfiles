# Volume and mute go to PipeWire's default output. The bar's gain widget
# hears the change by itself, so there's nothing to refresh.
# -l 1.0 caps the keys at 100%, like the widget.
unbindsym --locked XF86AudioRaiseVolume
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

unbindsym --locked XF86AudioLowerVolume
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

unbindsym --locked XF86AudioMute
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

unbindsym --locked XF86AudioMicMute
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindsym F8 exec ~/.config/quickshell/scripts/media-ctl.sh cycle

# Media keys go to the pinned player. (The defaults in config bind these with
# --locked to plain playerctl, which picks its own player, so replace those.)
unbindsym --locked XF86AudioPlay
bindsym --locked XF86AudioPlay exec ~/.config/quickshell/scripts/media-ctl.sh play-pause
unbindsym --locked XF86AudioPause
bindsym --locked XF86AudioPause exec ~/.config/quickshell/scripts/media-ctl.sh play-pause
unbindsym --locked XF86AudioNext
bindsym --locked XF86AudioNext exec ~/.config/quickshell/scripts/media-ctl.sh next
# past 5s the prev key restarts the track instead of going back
unbindsym --locked XF86AudioPrev
bindsym --locked XF86AudioPrev exec ~/.config/quickshell/scripts/media-ctl.sh previous

bindsym $mod+m exec ~/.config/sway/scripts/music-menu.sh
