include ~/.config/sway/theme.conf

bindsym $mod+Shift+t exec ~/.config/sway/scripts/theme-switch.sh
client.focused          $thm_blue $thm_bg $thm_fg $thm_blue $thm_blue
client.focused_inactive $thm_bg   $thm_bg $thm_fg $thm_bg   $thm_bg
client.unfocused        $thm_bg   $thm_bg $thm_fg $thm_bg   $thm_bg
client.urgent           $thm_fg   $thm_bg $thm_fg $thm_fg   $thm_fg
