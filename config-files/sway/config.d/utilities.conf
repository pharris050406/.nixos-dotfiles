#browser
set $browser firefox
set $mod Mod4
bindsym $mod+Shift+b exec $browser

#screenshots
unbindsym Print
# quick region → file + clipboard
bindsym Print exec sh -c 'f=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png; mkdir -p ~/Pictures/Screenshots; grim -g "$(slurp)" "$f" && wl-copy < "$f"'

# full screen → satty to crop/annotate
bindsym Shift+Print exec sh -c 'f=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png; mkdir -p ~/Pictures/Screenshots; grim - | satty --filename - --output-filename "$f" --initial-tool crop --copy-command wl-copy --early-exit'

# bindsym $mod+t      exec trace toggle
# bindsym $mod+Ctrl+t exec trace kill


bindsym $mod+t exec trace
bindsym $mod+Ctrl+c exec trace -c
bindsym $mod+Shift+t exec trace edit

bindsym $mod+Shift+g exec ~/.config/sway/scripts/gauges.sh next
bindsym $mod+Ctrl+g  exec ~/.config/sway/scripts/gauges.sh reset
