#browser
set $browser firefox
set $mod Mod4
bindsym $mod+Shift+b exec $browser

#screenshots
unbindsym Print
# one filename, worked out once: two `date` calls can land in different seconds
bindsym Print exec sh -c 'f=~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png; mkdir -p ~/Pictures/Screenshots; grim -g "$(slurp)" "$f" && wl-copy --primary < "$f"'

