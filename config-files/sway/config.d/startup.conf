exec sh -c 'until nc -z 127.0.0.1 6600; do sleep 0.1; done; exec env MPD_HOST=127.0.0.1 mpd-mpris > /tmp/mpd-mpris-sway.log 2>&1'
exec qs
exec autotiling

# for screensharing. --systemd: on NixOS the portals are systemd user
# services, so they need these too, not just D-Bus activation.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
