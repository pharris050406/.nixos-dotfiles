# Deep Field look for SwayFX (>= 0.6), matching the bar's Theme.qml.

set $df_bg     #181825
set $df_bg2    #232336
set $df_fg     #cdd6f4
set $df_muted  #585b70
set $df_blue   #8caaee
set $df_red    #e78284
set $df_mauve  #ca9ee6

font pango:JetBrainsMono Nerd Font 10
default_border pixel 1
default_floating_border pixel 1
gaps inner 4
gaps outer 0
smart_gaps off

#                       border      background  text       indicator   child_border
client.focused          $df_blue    $df_bg2     $df_fg     $df_mauve   $df_blue
client.focused_inactive $df_muted   $df_bg      $df_fg     $df_muted   $df_muted
client.unfocused        $df_bg2     $df_bg      $df_muted  $df_bg2     $df_bg2
client.urgent           $df_red     $df_bg      $df_fg     $df_red     $df_red
client.placeholder      $df_bg      $df_bg      $df_fg     $df_bg      $df_bg
client.background       $df_bg

# ---------------- SwayFX ----------------
corner_radius 4
titlebar_separator disable

# focused window: a faint centred blue glow; the rest a plain dark shadow
shadows enable
shadows_on_csd disable
shadow_blur_radius 4
shadow_offset 0 0
shadow_color #8caaee55
shadow_inactive_color #00000070

# blur behind anything translucent; a little noise stops gradients banding
blur enable
blur_xray disable
blur_passes 3
blur_radius 1
blur_noise 0.035
blur_brightness 0.92
blur_contrast 1.0
blur_saturation 1.2

default_dim_inactive 0.10
dim_inactive_colors.unfocused #0b0b14FF
dim_inactive_colors.urgent #e78284FF

animation_duration_ms 90

# ---------------- layer surfaces (bar, panels, menus) ----------------
layer_effects "deepfield" {
    blur enable;
    blur_ignore_transparent disable;
    shadows enable;
}
layer_effects "deepfield-signals" {
    blur enable;
    blur_ignore_transparent enable;
}
layer_effects "quickshell-wifi" {
    blur enable;
    blur_ignore_transparent enable;
    shadows enable;
    corner_radius 6;
}
layer_effects "wmenu" {
    blur enable;
    shadows enable;
    corner_radius 8;
}
