# ~/.config/sway/deepfield.conf
# SwayFX theme matching the Deep Field bar. Needs SwayFX >= 0.6.
#
# Use it by adding ONE line at the very END of ~/.config/sway/config
# (last so it wins over earlier colors/gaps/borders):
#
#     include ~/.config/sway/deepfield.conf
#
# The idea: windows are viewports onto the deep field. Rounded corners, the
# sky showing through the gaps, and the focused window giving off a faint
# blue glow, like it's the brightest thing in the field.
# Unfocused windows sit a little in shadow, like the night side of a planet.

# ---------------- palette (same as the bar's Theme.qml) ----------------
set $df_bg     #181825
set $df_bg2    #232336
set $df_fg     #cdd6f4
set $df_muted  #585b70
set $df_teal   #81c8be
set $df_blue   #8caaee
set $df_green  #a6d189
set $df_gold   #e5c890
set $df_red    #e78284
set $df_mauve  #ca9ee6

# ---------------- the sky ----------------
# output * bg #181825 solid_color

# ---------------- geometry ----------------
font pango:JetBrainsMono Nerd Font 10
default_border pixel 2
default_floating_border pixel 2
gaps inner 10
gaps outer 4
smart_gaps off

# ---------------- window colors ----------------
#                       border      background  text       indicator   child_border
client.focused          $df_blue    $df_bg2     $df_fg     $df_mauve   $df_blue
client.focused_inactive $df_muted   $df_bg      $df_fg     $df_muted   $df_muted
client.unfocused        $df_bg2     $df_bg      $df_muted  $df_bg2     $df_bg2
client.urgent           $df_red     $df_bg      $df_fg     $df_red     $df_red
client.placeholder      $df_bg      $df_bg      $df_fg     $df_bg      $df_bg
client.background       $df_bg

# ======================= SwayFX =======================

# viewports, not boxes
corner_radius 10
titlebar_separator disable

# Focused window: a faint blue glow, centered (no offset), like starlight.
# Everything else casts an ordinary dark shadow onto the sky.
shadows enable
shadows_on_csd disable
shadow_blur_radius 4
shadow_offset 0 0
shadow_color #8caaee55
shadow_inactive_color #00000070

# Blur behind anything translucent (set your terminal's alpha < 1 to see it).
# A whisper of noise keeps blurred gradients from banding: think CMB.
blur enable
blur_xray disable
blur_passes 3
blur_radius 1
blur_noise 0.035
blur_brightness 0.92
blur_contrast 1.0
blur_saturation 1.2

# The night side: unfocused windows dim slightly toward deep space.
default_dim_inactive 0.10
dim_inactive_colors.unfocused #0b0b14FF
dim_inactive_colors.urgent #e78284FF

# Window open/close/move animations.
animation_duration_ms 180

# ---------------- the bar and its panels ----------------
# Set `glass: true` at the top of the bar's shell.qml so these have
# something to blur through.
layer_effects "deepfield" {
    blur enable;
    blur_ignore_transparent disable;
    shadows enable;
}
layer_effects "deepfield-signals" {
   blur enable;
   blur_ignore_transparent enable;
}
layer_effects "quickshell-wifi" {
    blur enable;
    blur_ignore_transparent enable;
    shadows enable;
}
# Optional: blur the whole screen while the Wi-Fi panel is open.
# layer_effects "quickshell-wifi-backdrop" blur enable

# wmenu (your doc launcher and rmpc history picker) floats over glass too.
# Give it a translucent background to see it, e.g. wmenu -N 181825cc ...
layer_effects "wmenu" {
    blur enable;
    shadows enable;
    corner_radius 8;
}
